<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WeVote!</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="ambient-bg" aria-hidden="true">
  <div class="bg-layer bg-one"></div>
  <div class="bg-layer bg-two"></div>
  <div class="bg-layer bg-three"></div>
  <div class="bg-wash"></div>
</div>
<div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
  <div class="loader-card"><div class="loader-ring"></div><span>Menyiapkan WeVote...</span></div>
</div>
<header>
  <div class="brand">
    <div class="logo"><img id="schoolLogo" src="https://placehold.co/80x80?text=Logo" alt="Logo sekolah"></div>
    <div><b id="schoolName">WeVote!</b><small>Digital Election</small></div>
  </div>
  <nav>
    <button data-page="home">Home</button>
    <button data-page="vision">Visi Misi Sekolah</button>
    <button data-page="about">About</button>
    <button data-page="contact">Contact</button>
    <button id="theme" aria-label="Ganti tema">☾</button>
    <button id="loginBtn" class="primary">Login Pemilih</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
